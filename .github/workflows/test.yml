# GitHub Actions CI — 每次 push / PR 自动跑 API 冒烟测试
# 测试使用临时数据目录（DATA_DIR），不污染真实数据
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run API smoke tests
        run: npm test
