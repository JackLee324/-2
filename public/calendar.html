<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线互动校历 Academic Calendar | 清澜山幼儿园 TE-PE</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1D3557;
            --primary-red: #E63946;
            --accent-gold: #F4A261;
            --accent-teal: #2A9D8F;
            --bg-main: #F8F9FA;
            --bg-card: #FFFFFF;
            --text-dark: #2B2D42;
            --text-muted: #6C757D;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 30px rgba(29, 53, 87, 0.08);
            --radius-lg: 24px;

            /* Event type colors — master source of truth */
            --evt-parent:   #9B59B6;
            --evt-school:   #F1C40F;
            --evt-campus:   #E91E8C;
            --evt-pd:       #95A5A6;
            --evt-holiday:  #27AE60;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        .zh { font-size: 1.25em; font-weight: 700; color: var(--primary-blue); }
        .en { font-size: 0.75em; font-weight: 400; color: var(--text-muted); }

        /* Header — Glassmorphism sticky */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
        }

        .header-container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .site-logo {
            height: 52px;
            width: auto;
            object-fit: contain;
            display: block;
            transition: transform 0.3s ease;
        }

        .logo-link:hover .site-logo {
            transform: scale(1.05);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links .nav-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            padding: 0.5rem 0;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-links .nav-link .nav-label {
            font-weight: 700;
            color: var(--primary-blue);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .nav-links .nav-link .nav-en {
            font-size: 0.7rem;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            margin-top: 2px;
        }

        .nav-links .nav-link:hover {
            transform: translateY(-2px);
        }

        .nav-links .nav-link:hover .nav-label,
        .nav-links .nav-link:hover .nav-en {
            color: var(--primary-blue);
        }

        .nav-links .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: var(--accent-teal);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }

        .nav-links .nav-link:hover::after,
        .nav-links .nav-link.active::after {
            width: calc(100% - 1.2rem);
        }

        .nav-links .nav-link.active .nav-label,
        .nav-links .nav-link.active .nav-en {
            color: var(--primary-blue);
        }
        /* Page wrapper */
        .calendar-page {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
        }

        /* ── Page Header ── */
        .page-header {
            padding: 2.5rem 0 1.5rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
        }

        .page-title-group h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1.2;
        }

        .page-title-group p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .legend {
            display: flex;
            gap: 1.25rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Split Layout ── */
        .calendar-split {
            display: grid;
            grid-template-columns: 65fr 35fr;
            gap: 1.5rem;
            align-items: start;
        }

        /* ── Left: Calendar Grid ── */
        .calendar-grid-panel {
            background: var(--bg-card);
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid rgba(29, 53, 87, 0.06);
        }

        /* Month Navigator */
        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(29, 53, 87, 0.06);
        }

        .cal-nav-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(29, 53, 87, 0.06);
            color: var(--primary-blue);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .cal-nav-btn:hover {
            background: var(--primary-blue);
            color: white;
            transform: scale(1.08);
        }

        .cal-month-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary-blue);
            text-align: center;
            flex: 1;
        }

        .cal-month-title .year {
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-muted);
            font-family: 'Noto Sans SC', sans-serif;
        }

        .cal-today-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid var(--primary-blue);
            background: transparent;
            color: var(--primary-blue);
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .cal-today-btn:hover {
            background: var(--primary-blue);
            color: white;
        }

        /* Weekday headers */
        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: rgba(29, 53, 87, 0.03);
            border-bottom: 1px solid rgba(29, 53, 87, 0.05);
        }

        .cal-weekday {
            text-align: center;
            padding: 0.5rem 0.25rem;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Day grid */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day-cell {
            min-height: 72px;
            border-right: 1px solid rgba(29, 53, 87, 0.04);
            border-bottom: 1px solid rgba(29, 53, 87, 0.04);
            padding: 6px 6px 4px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-cell:hover {
            background: rgba(29, 53, 87, 0.025);
        }

        .day-cell.other-month {
            background: rgba(29, 53, 87, 0.018);
        }

        .day-cell.other-month .day-number {
            color: #CBD5E1;
        }

        .day-cell.today {
            background: rgba(230, 57, 70, 0.05);
        }

        .day-cell.today .day-number {
            border: 2.5px solid var(--primary-red);
            color: var(--primary-red);
            font-weight: 800;
        }

        .day-cell.selected {
            background: rgba(29, 53, 87, 0.05);
        }

        .day-cell.selected .day-number {
            background: var(--accent-teal) !important;
            border-color: var(--accent-teal) !important;
            color: white !important;
        }

        .day-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1;
            transition: all 0.15s;
        }

        /* Event dots inside day cells */
        .day-events {
            margin-top: 3px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .day-event-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .day-event-chip {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .day-event-text {
            font-size: 0.68rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            margin-top: 1px;
        }

        /* ── Ribbon / Flow border-radius for multi-day events ─────────────────────── */
        /* Start day: left side rounded */
        .day-cell.ribbon-start {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }
        /* End day: right side rounded */
        .day-cell.ribbon-end {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
        }
        /* Middle day: no rounding */
        .day-cell.ribbon-mid {
            border-radius: 0 !important;
        }
        /* Single-day event: both sides rounded */
        .day-cell.ribbon-start.ribbon-end {
            border-radius: 12px !important;
        }

        /* ── Right: Sidebar ── */
        .calendar-sidebar {
            position: sticky;
            top: 90px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Monthly Theme Banner */
        .theme-banner {
            background: linear-gradient(135deg, var(--primary-blue) 0%, #264573 100%);
            border-radius: 20px;
            padding: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .theme-banner::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }

        .theme-banner-month {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
            margin-bottom: 0.4rem;
        }

        .theme-banner h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            font-weight: 900;
            color: white;
            line-height: 1.3;
            margin-bottom: 0.25rem;
        }

        .theme-banner-en {
            font-size: 0.8rem;
            opacity: 0.75;
            font-weight: 400;
        }

        .theme-banner-icon {
            position: absolute;
            bottom: -10px;
            right: 15px;
            font-size: 4rem;
            opacity: 0.12;
        }

        /* Event Detail Cards */
        .event-detail-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .event-detail-empty {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(29, 53, 87, 0.06);
        }

        .event-detail-empty .emoji { font-size: 2.5rem; margin-bottom: 0.75rem; }
        .event-detail-empty h3 { font-size: 1rem; color: var(--primary-blue); margin-bottom: 0.35rem; }
        .event-detail-empty p { font-size: 0.82rem; color: var(--text-muted); }

        .event-detail-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.1rem 1.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(29, 53, 87, 0.06);
            transition: all 0.3s ease;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .event-detail-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            border-radius: 4px 0 0 4px;
        }

        .event-detail-card.highlight-flash {
            animation: cardFlash 0.8s ease-out;
        }

        @keyframes cardFlash {
            0%   { background: rgba(42, 157, 143, 0.15); transform: translateX(4px); }
            100% { background: var(--bg-card); transform: translateX(0); }
        }

        @keyframes focusFlash {
            0%   { background: #fff; box-shadow: 0 0 0 rgba(42,157,143,0); }
            50%  { background: rgba(42,157,143,0.15); transform: scale(1.02); box-shadow: 0 4px 16px rgba(42,157,143,0.2); }
            100% { background: #fff; transform: scale(1); }
        }

        .event-detail-card.focus-flash {
            animation: focusFlash 0.7s ease-out forwards;
        }

        .event-detail-card.selected-card {
            border-left: 4px solid var(--accent-teal);
            background: rgba(42, 157, 143, 0.04);
        }
        .event-detail-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .event-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            gap: 0.5rem;
        }

        .event-detail-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-detail-day {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1;
        }

        .event-detail-month-yr {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.3;
        }

        .event-type-pill {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.68rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .event-detail-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1.35;
            margin-bottom: 0.2rem;
        }

        .event-detail-title-en {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 0.4rem;
        }

        .event-detail-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .event-detail-range {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Loading */
        .loading-overlay {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 2rem;
            gap: 1rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(29, 53, 87, 0.1);
            border-top-color: var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 900px) {
            .calendar-split {
                grid-template-columns: 1fr;
            }

            .calendar-sidebar {
                position: static;
            }

            .day-cell {
                min-height: 56px;
            }

            .day-event-text {
                display: none;
            }
        }

        @media (max-width: 640px) {
            .header-container { padding: 0.65rem 1rem; }
            .site-logo { height: 40px; }
            .nav-links { gap: 1rem; }
            .nav-links .nav-en { display: none; }

            .page-header { flex-direction: column; align-items: flex-start; }
            .legend { gap: 0.75rem; }
            .day-cell { min-height: 46px; padding: 4px 3px 3px; }
            .day-number { width: 22px; height: 22px; font-size: 0.72rem; }
            .cal-nav { padding: 1rem; }
            .theme-banner h2 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="site-header">
    <div class="header-container">
        <a href="/" class="logo-link">
            <img src="/logo.png" alt="Tsinglan Kindergarten" class="site-logo">
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link"><span class="nav-label">🏠 首页</span><span class="nav-en">Home</span></a>
            <a href="/calendar.html" class="nav-link"><span class="nav-label">📅 校历</span><span class="nav-en">Calendar</span></a>
            <a href="/admin" class="nav-link"><span class="nav-label">⚙️ 管理</span><span class="nav-en">Admin</span></a>
        </nav>
    </div>
</header>

<!-- Calendar Page -->
<div class="calendar-page">

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-title-group">
            <h1><span class="zh">在线互动校历</span> <span class="en" style="font-size:0.55em;color:var(--text-muted);font-weight:400;">Academic Calendar 2026–2027</span></h1>
            <p>清澜山幼儿园体育课程校历 · 点击日期查看详情</p>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--evt-parent)"></div>家长在园日</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--evt-school)"></div>上学日</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--evt-campus)"></div>活动日</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--evt-pd)"></div>培训日</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--evt-holiday)"></div>假期</div>
        </div>
    </div>

    <!-- Split Layout -->
    <div class="calendar-split">

        <!-- Left: Calendar Grid -->
        <div class="calendar-grid-panel">
            <!-- Month Navigator -->
            <div class="cal-nav">
                <button class="cal-nav-btn" onclick="navigateMonth(-1)" title="上一月">‹</button>
                <div class="cal-month-title">
                    <span id="calMonthName">三月 March</span>
                    <div class="year" id="calYear">2026</div>
                </div>
                <button class="cal-nav-btn" onclick="navigateMonth(1)" title="下一月">›</button>
                <button class="cal-today-btn" onclick="goToToday()">今天 Today</button>
            </div>

            <!-- Weekday Labels -->
            <div class="cal-weekdays">
                <div class="cal-weekday">周日 Sun</div>
                <div class="cal-weekday">周一 Mon</div>
                <div class="cal-weekday">周二 Tue</div>
                <div class="cal-weekday">周三 Wed</div>
                <div class="cal-weekday">周四 Thu</div>
                <div class="cal-weekday">周五 Fri</div>
                <div class="cal-weekday">周六 Sat</div>
            </div>

            <!-- Day Grid -->
            <div class="cal-grid" id="calGrid"></div>
        </div>

        <!-- Right: Sidebar -->
        <div class="calendar-sidebar">
            <!-- Monthly Theme Banner -->
            <div class="theme-banner" id="themeBanner">
                <div class="theme-banner-month" id="themeMonth">MARCH</div>
                <h2 id="themeName">奥林匹克月</h2>
                <div class="theme-banner-en" id="themeNameEn">Olympic Month</div>
                <div class="theme-banner-icon">🏅</div>
            </div>

            <!-- Event Detail List -->
            <div class="event-detail-list" id="eventDetailList">
                <div class="event-detail-empty">
                    <div class="emoji">📅</div>
                    <h3>选择日期查看详情</h3>
                    <p>点击左侧日历中的日期，查看当天校历安排</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const BASE_API_URL    = 'http://localhost:3000';
const MONTH_NAMES_ZH  = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const MONTH_NAMES_EN  = ['','January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_ABBR     = ['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const WEEKDAY_NAME_ZH = ['周日','周一','周二','周三','周四','周五','周六'];

const EVENT_TYPES = {
    ParentEvent:   { label: '家长在园日',   color: '#9B59B6', textColor: '#fff' },
    SchoolDay:     { label: '上学日',       color: '#F1C40F', textColor: '#333' },
    OnCampusEvent: { label: '活动日',       color: '#E91E8C', textColor: '#fff' },
    PDDay:         { label: '培训/工作日',  color: '#95A5A6', textColor: '#fff' },
    Holiday:       { label: '假期',         color: '#27AE60', textColor: '#fff' }
};

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let allEvents      = [];
let monthlyThemes  = [];
let currentYear    = new Date().getFullYear();
let currentMonth   = new Date().getMonth() + 1; // 1-12
let selectedDate   = null;   // 'YYYY-MM-DD' string
let beijingToday   = null;   // 'YYYY-MM-DD' string (from server)
let beijingYear    = null;
let beijingMonth   = null;

// ═══════════════════════════════════════════════
// INIT — Sync Beijing Time
// ═══════════════════════════════════════════════
async function init() {
    await syncBeijingTime();
    await loadCalendarData();
    goToMonth(beijingYear, beijingMonth);
    initFloatingNotice();
}

// ─── Floating Notice ──────────────────────────────────────────────────────────
function initFloatingNotice() {
    const pill     = document.getElementById('floatingNotice');
    const dot      = document.getElementById('noticeDot');
    const textEl   = document.getElementById('noticeText');
    const closeBtn = document.getElementById('noticeClose');
    if (!pill) return;

    // Read notice from window.globalNotice (set by loadCalendarData)
    const notice = window.globalNotice || {};
    const SESSION_KEY = 'noticeClosedHash';

    if (!notice.isActive || !notice.content) return;

    // Store a hash of the content so updated notices still show
    const contentHash = simpleHash(notice.content);
    if (sessionStorage.getItem(SESSION_KEY) === contentHash) return;

    // Set content + type
    textEl.textContent = notice.content;
    dot.className = 'notice-type-dot ' + (notice.type || 'info');

    // Smart marquee: duplicate text if it overflows container
    requestAnimationFrame(() => {
        const container = textEl.parentElement;
        if (container && textEl.scrollWidth > container.clientWidth + 4) {
            // Text overflows — duplicate for seamless loop
            textEl.textContent = notice.content + '    ·    ' + notice.content + '    ·    ' + notice.content;
            textEl.classList.add('marquee');
        }
    });

    // Show pill with spring animation
    requestAnimationFrame(() => pill.classList.add('show'));

    // Close button: dismiss + remember content hash
    closeBtn.addEventListener('click', () => {
        pill.classList.remove('show');
        sessionStorage.setItem(SESSION_KEY, contentHash);
    });
}

// Simple hash of notice content to detect changes
function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0; // Convert to 32-bit integer
    }
    return hash.toString(36);
}

// Sync with server time (Beijing timezone)
async function syncBeijingTime() {
    try {
        const res = await fetch(BASE_API_URL + '/api/time?t=' + Date.now());
        const json = await res.json();
        if (json.success) {
            const d = new Date(json.beijing || json.time);
            beijingYear  = d.getFullYear();
            beijingMonth = d.getMonth() + 1;
            const bd = d.getDate();
            const bm = String(beijingMonth).padStart(2, '0');
            beijingToday = `${beijingYear}-${bm}-${String(bd).padStart(2, '0')}`;
        }
    } catch (e) {
        // Fallback to local time if server unreachable
        const d = new Date();
        beijingYear  = d.getFullYear();
        beijingMonth = d.getMonth() + 1;
        const bd = d.getDate();
        const bm = String(beijingMonth).padStart(2, '0');
        beijingToday = `${beijingYear}-${bm}-${String(bd).padStart(2, '0')}`;
    }
}

// Load calendar data from server
async function loadCalendarData() {
    try {
        const res  = await fetch(BASE_API_URL + '/api/calendar?t=' + Date.now());
        const json  = await res.json();
        if (json.success) {
            allEvents     = json.data.events     || [];
            monthlyThemes = json.data.monthlyThemes || [];
            window.globalNotice = json.data.globalNotice || { isActive: false, type: 'info', content: '' };
        }
    } catch (e) {
        allEvents     = [];
        monthlyThemes = [];
        window.globalNotice = { isActive: false, type: 'info', content: '' };
    }
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function navigateMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    if (currentMonth < 1)  { currentMonth = 12; currentYear--; }
    selectedDate = null; // reset selection on manual nav
    renderAll();
}

function goToToday() {
    currentYear  = beijingYear;
    currentMonth = beijingMonth;
    selectedDate = beijingToday;
    renderAll();
}

function goToMonth(year, month) {
    currentYear  = year;
    currentMonth = month;
    selectedDate  = beijingToday; // auto-select today when loading
    renderAll();
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function renderAll() {
    try { renderMonthNav(); } catch(e) { console.error('nav', e); }
    try { renderThemeBanner(); } catch(e) { console.error('banner', e); }
    try {
        renderCalendarGrid();
        renderEventSidebar();
    } catch (err) {
        console.error('日历渲染失败:', err);
        // Fallback: show grid skeleton
        const grid = document.getElementById('calGrid');
        if (grid) {
            grid.innerHTML = '<div style="padding:2rem;text-align:center;color:#94A3B8;font-size:0.9rem;">日历加载失败，请刷新重试</div>';
        }
    }
}

function renderMonthNav() {
    document.getElementById('calMonthName').textContent =
        `${MONTH_NAMES_ZH[currentMonth]} ${MONTH_NAMES_EN[currentMonth]}`;
    document.getElementById('calYear').textContent = currentYear;
}

function renderThemeBanner() {
    const theme = monthlyThemes.find(t => t.month === currentMonth);
    const themeMonthEl = document.getElementById('themeMonth');
    const themeNameEl  = document.getElementById('themeName');
    const themeNameEnEl = document.getElementById('themeNameEn');

    if (theme) {
        themeMonthEl.textContent = MONTH_ABBR[currentMonth];
        themeNameEl.textContent  = theme.theme.split(' ')[0]; // Chinese part
        themeNameEnEl.textContent = theme.themeEn || '';
    } else {
        themeMonthEl.textContent = MONTH_ABBR[currentMonth];
        themeNameEl.textContent  = MONTH_NAMES_ZH[currentMonth];
        themeNameEnEl.textContent = MONTH_NAMES_EN[currentMonth];
    }
}

function renderCalendarGrid() {
    const grid = document.getElementById('calGrid');
    if (!grid) return;
    grid.innerHTML = '';

    const year   = currentYear;
    const month  = currentMonth;
    const firstDay = new Date(year, month - 1, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(year, month, 0).getDate();
    const daysInPrevMonth = new Date(year, month - 1, 0).getDate();
    const totalCells = firstDay + daysInMonth;
    const rows = Math.ceil(totalCells / 7);

    // ─── Helpers ───────────────────────────────────────────────────────────────
    const safeHex = (hex) => {
        if (!hex || typeof hex !== 'string') return '#999999';
        const clean = hex.startsWith('#') ? hex.slice(1, 7) : hex.slice(0, 6);
        return /^[0-9A-Fa-f]{6}$/.test(clean) ? '#' + clean : '#999999';
    };

    const hexToRgba = (hex, alpha) => {
        const h = safeHex(hex).replace('#', '');
        const r = parseInt(h.slice(0, 2), 16);
        const g = parseInt(h.slice(2, 4), 16);
        const b = parseInt(h.slice(4, 6), 16);
        return `rgba(${r},${g},${b},${alpha})`;
    };

    const nextDateStr = (ds) => {
        try {
            const [y, m, d] = ds.split('-').map(Number);
            const dt = new Date(y, m - 1, d + 1);
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
        } catch { return ds; } // Guard against malformed dates
    };

    // ─── Build events-by-date map (string comparison, no Date objects) ─────────
    const eventsByDate = {};
    try {
        allEvents.forEach(ev => {
            if (!ev || !ev.date) return;
            const start = ev.date;
            const end   = ev.endDate || ev.date;
            if (start > end) return; // Guard: bad data
            let d = start;
            while (d <= end) {
                if (!eventsByDate[d]) eventsByDate[d] = [];
                eventsByDate[d].push(ev);
                const next = nextDateStr(d);
                if (next === d) break; // Guard: infinite loop
                d = next;
            }
        });
    } catch (e) { console.error('events map error', e); }

    // ─── Conflict resolution ───────────────────────────────────────────────────
    const PRIORITY = { Holiday: 3, SchoolDay: 2, OnCampusEvent: 1, ParentEvent: 1, PDDay: 0 };
    const resolveConflicts = (evs) => {
        if (!evs || !evs.length) return { top: null, mode: 0, events: [] };
        const safe = evs.filter(Boolean);
        const sorted = [...safe].sort((a, b) => {
            const pa = PRIORITY[a.type] ?? 0;
            const pb = PRIORITY[b.type] ?? 0;
            if (pb !== pa) return pb - pa;
            return (b.backgroundColor || '').localeCompare(a.backgroundColor || '');
        });
        if (sorted.length === 1) return { top: sorted[0], mode: 1, events: sorted };
        if (sorted.length === 2) return { top: sorted[0], second: sorted[1], mode: 2, events: sorted };
        return { top: sorted[0], events: sorted.slice(0, 3), mode: 3, hidden: sorted.slice(3) };
    };

    // ─── Render ───────────────────────────────────────────────────────────────
    let cellIndex = 0;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < 7; c++) {
            cellIndex++;
            let dayNum, dateStr, isOtherMonth = false, isFiller = false;

            if (cellIndex <= firstDay) {
                // Filler cell: invisible placeholder so 1st lands on correct weekday
                const fillerEl = document.createElement('div');
                fillerEl.className = 'day-cell other-month';
                fillerEl.style.visibility = 'hidden';
                fillerEl.innerHTML = '<div class="day-number">—</div>';
                grid.appendChild(fillerEl);
                continue;
            } else if (cellIndex <= firstDay + daysInMonth) {
                dayNum  = cellIndex - firstDay;
                dateStr = `${year}-${String(month).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
            } else {
                dayNum  = cellIndex - firstDay - daysInMonth;
                const nextM = month === 12 ? 1 : month + 1;
                const nextY = month === 12 ? year + 1 : year;
                dateStr = `${nextY}-${String(nextM).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                isOtherMonth = true;
            }

            const isToday    = dateStr === beijingToday;
            const isSelected = dateStr === selectedDate;
            const weekday   = c; // 0=Sun (row-start), 6=Sat (row-end)

            const evs = eventsByDate[dateStr] || [];

            // Build ribbon flags per event
            const evsWithFlags = evs.map(ev => {
                const evStart = ev.date;
                const evEnd   = ev.endDate || ev.date;
                return {
                    ev,
                    isStart: dateStr === evStart,
                    isEnd:   dateStr === evEnd,
                    showText: (dateStr === evStart) || (weekday === 0)
                };
            });

            const resolved = resolveConflicts(evs);
            const mode = resolved.mode;

            // ── Background ──
            let cellStyle = '';
            if (mode === 1 && resolved.top) {
                const bg = safeHex(resolved.top.backgroundColor || EVENT_TYPES[resolved.top.type]?.color);
                cellStyle = `background:${hexToRgba(bg, 0.12)};`;
            } else if (mode === 2 && resolved.top && resolved.second) {
                const c1 = safeHex(resolved.top.backgroundColor    || EVENT_TYPES[resolved.top.type]?.color);
                const c2 = safeHex(resolved.second.backgroundColor || EVENT_TYPES[resolved.second.type]?.color);
                cellStyle = `background:linear-gradient(to bottom,${hexToRgba(c1,0.12)} 50%,${hexToRgba(c2,0.12)} 50%);`;
            } else if (mode >= 3 && resolved.top) {
                const c = safeHex(resolved.top.backgroundColor || EVENT_TYPES[resolved.top.type]?.color);
                cellStyle = `background:${hexToRgba(c, 0.12)};`;
            }

            // ── Ribbon classes ──
            const ribbonParts = evsWithFlags.map(e => {
                if (!e.isStart && !e.isEnd) return 'ribbon-mid';
                const p = ['ribbon'];
                if (e.isStart) p.push('ribbon-start');
                if (e.isEnd)   p.push('ribbon-end');
                return p.join(' ');
            });
            const ribbonClass = ribbonParts.join(' ');

            // ── Event chips / badges ──
            let eventDisplay = '';
            if (mode === 1 && resolved.top) {
                const ev  = resolved.top;
                const bg  = safeHex(ev.backgroundColor || EVENT_TYPES[ev.type]?.color || '#999');
                const show = evsWithFlags.find(x => x.ev === ev)?.showText;
                eventDisplay = `<div class="day-event-chip">
                    <div class="day-event-dot" style="background:${bg}"></div>
                    ${show ? `<div class="day-event-text">${escapeHtml((ev.title||'').split(' ')[0])}</div>` : ''}
                </div>`;
            } else if (mode === 2 && resolved.top && resolved.second) {
                const dots = [resolved.top, resolved.second].map(ev => {
                    const bg = safeHex(ev.backgroundColor || EVENT_TYPES[ev.type]?.color || '#999');
                    return `<div style="width:6px;height:6px;border-radius:50%;background:${bg};flex-shrink:0;"></div>`;
                }).join('');
                eventDisplay = `<div style="display:flex;gap:3px;align-items:center;">${dots}</div>`;
            } else if (mode >= 3) {
                const dots = (resolved.events || []).map(ev => {
                    const bg = safeHex(ev.backgroundColor || EVENT_TYPES[ev.type]?.color || '#999');
                    return `<div style="width:7px;height:7px;border-radius:50%;background:${bg};flex-shrink:0;"></div>`;
                }).join('');
                eventDisplay = `<div style="display:flex;gap:2px;flex-wrap:wrap;">${dots}</div>`;
            }

            const cellClass = [
                'day-cell',
                isOtherMonth ? 'other-month' : '',
                isToday ? 'today' : '',
                isSelected ? 'selected' : '',
                ribbonClass
            ].filter(Boolean).join(' ');

            const cell = document.createElement('div');
            cell.className = cellClass;
            if (cellStyle) cell.setAttribute('style', cellStyle);
            cell.dataset.date = dateStr;
            cell.innerHTML = `
                <div class="day-number">${dayNum}</div>
                <div class="day-events">${eventDisplay}</div>
            `;
            cell.addEventListener('click', () => onDayClick(dateStr));
            grid.appendChild(cell);
        }
    }
}

// Advance YYYY-MM-DD string by one day
function nextDateStr(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d + 1);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function onDayClick(dateStr) {
    selectedDate = dateStr;
    // Update selection visual in grid
    document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.toggle('selected', cell.dataset.date === dateStr);
    });
    // Scroll the sidebar card for this date to center
    scrollSidebarToSelected();
    // Re-render sidebar to update "selected" highlight on cards
    renderEventSidebar();
}

function scrollSidebarToSelected() {
    const cards = document.querySelectorAll('.event-detail-card[data-date="' + selectedDate + '"]');
    const card = cards[0];
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // Premium focus flash animation
        card.classList.remove('focus-flash');
        void card.offsetWidth;
        card.classList.add('focus-flash');
        setTimeout(() => card.classList.remove('focus-flash'), 700);
    }
}

function renderEventSidebar() {
    const list = document.getElementById('eventDetailList');

    // Always show ALL events for the current displayed month
    const yearStr  = String(currentYear);
    const monthStr = String(currentMonth).padStart(2, '0');
    const prefix   = yearStr + '-' + monthStr;

    const monthEvents = allEvents
        .filter(ev => {
            // Event overlaps this month if: ev.date <= last-day-of-month AND ev.endDate >= first-day-of-month
            const evStart = ev.date; // YYYY-MM-DD
            const evEnd   = ev.endDate || ev.date;
            const monthLast = `${yearStr}-${monthStr}-${daysInMonth(currentYear, currentMonth)}`;
            return evStart <= monthLast && evEnd >= `${prefix}-01`;
        })
        .sort((a, b) => a.date.localeCompare(b.date));

    if (monthEvents.length === 0) {
        list.innerHTML = `
            <div class="event-detail-empty">
                <div class="emoji">☕</div>
                <h3>本月暂无重要事项安排</h3>
                <p>切换其他月份或前往后台添加校历事件</p>
            </div>`;
        return;
    }

    // Build all event cards for the month
    let html = '';
    monthEvents.forEach(ev => {
        const typeInfo = EVENT_TYPES[ev.type] || { label: ev.type, color: '#999', textColor: '#fff' };
        const bg   = ev.backgroundColor || typeInfo.color;
        const txt  = ev.textColor || typeInfo.textColor;
        const isMulti = ev.endDate && ev.endDate !== ev.date;

        // Parse display date from ev.date
        const [ey, em, ed] = ev.date.split('-').map(Number);
        const wday = WEEKDAY_NAME_ZH[new Date(ey, em - 1, ed).getDay()];
        const monthName = MONTH_NAMES_EN[em];
        const isSelected = ev.date === selectedDate;

        html += `
        <div class="event-detail-card${isSelected ? ' selected-card' : ''}" data-date="${ev.date}">
            <div class="event-detail-header">
                <div class="event-detail-date">
                    <div class="event-detail-day">${ed}</div>
                    <div class="event-detail-month-yr">${monthName}<br>${wday}</div>
                </div>
                <span class="event-type-pill" style="background:${bg};color:${txt}">${typeInfo.label}</span>
            </div>
            <div class="event-detail-title">${escapeHtml(ev.title || '')}</div>
            ${ev.titleEn ? `<div class="event-detail-title-en">${escapeHtml(ev.titleEn)}</div>` : ''}
            ${ev.description ? `<div class="event-detail-desc">${escapeHtml(ev.description)}</div>` : ''}
            ${isMulti ? `<div class="event-detail-range">📅 ${ev.date} → ${ev.endDate}</div>` : ''}
        </div>`;
    });

    list.innerHTML = html;
}

// Helper: days in a given month
function daysInMonth(year, month) {
    return new Date(year, month, 0).getDate();
}

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ─── Navigation active-route ───────────────────
(function activateNavLink() {
    const path = window.location.pathname;
    document.querySelectorAll('.nav-link').forEach(function(link) {
        link.classList.remove('active');
        const href = link.getAttribute('href');
        if (href === '/') {
            if (path === '/' || path === '/index.html' || path === '/index.htm') link.classList.add('active');
        } else if (href && path.includes(href.replace(/^\//, ''))) {
            link.classList.add('active');
        }
    });
})();

// ─── Init ──────────────────────────────────────
document.addEventListener('DOMContentLoaded', init);
</script>
